services:
  database:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME:-socius}_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socius_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socius_password}
      POSTGRES_DB: ${POSTGRES_DB:-socius_cloud}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socius_user} -d ${POSTGRES_DB:-socius_cloud}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT_BIND:-5477}:5432"
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    networks:
      - socius_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ${PROJECT_NAME:-socius}_pgadmin
    restart: always
    ports:
      - "5089:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-root}
      SCRIPT_NAME: /pgadmin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - socius_network

  cache:
    image: redis:alpine
    container_name: ${PROJECT_NAME:-socius}_redis
    networks:
      - socius_network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: ${PROJECT_NAME:-socius}_minio
    user: "0:0"
    ports:
      - "${MINIO_API_PORT:-9005}:9000"
      - "${MINIO_CONSOLE_PORT:-9007}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-socius_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-socius_secret_minio}
    command: server /data --console-address ":9001"
    volumes:
      - ./docker/data/minio:/data
    networks:
      - socius_network

  minio-setup:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: ${PROJECT_NAME:-socius}_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set socius http://minio:9000 ${MINIO_ROOT_USER:-socius_minio} ${MINIO_ROOT_PASSWORD:-socius_secret_minio};
      mc mb socius/${MINIO_BUCKET:-socius-uploads} || true;
      mc anonymous set public socius/${MINIO_BUCKET:-socius-uploads};
      exit 0;
      "
    networks:
      - socius_network

  backend:
    build:
      context: ./serverapp
      dockerfile: Dockerfile.dev
    container_name: ${PROJECT_NAME:-socius}_backend
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-socius_user}:${POSTGRES_PASSWORD:-socius_password}@database:5432/${POSTGRES_DB:-socius_cloud}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-socius_user}:${POSTGRES_PASSWORD:-socius_password}@database:5432/${POSTGRES_DB:-socius_cloud}?schema=public
      REDIS_HOST: cache
      REDIS_PORT: 6379
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-customtokensecret}
      PORT: 3001
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-socius_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-socius_secret_minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-socius-uploads}
      APP_URL: ${APP_URL:-http://localhost:3001}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Limita el uso de heap en Node y hace GC más frecuente para no exceder los límites de docker
      NODE_OPTIONS: "--max-old-space-size=1024"
      AT_SECRET: ${AT_SECRET:-}
      RT_SECRET: ${RT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "3005:3001"
    volumes:
      - ./serverapp:/app
      - /app/node_modules
      - /app/dist
      - ./docker/data/uploads:/app/public/files
    networks:
      - socius_network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

  frontend:
    build:
      context: ./webapp
      dockerfile: Dockerfile.dev
    container_name: ${PROJECT_NAME:-socius}_frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      INTERNAL_API_URL: http://backend:3001
      NODE_ENV: ${NODE_ENV:-development}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # Limita el heap de Next.js y previene pérdidas de memoria en dev
      NODE_OPTIONS: "--max-old-space-size=1536"
    ports:
      - "3050:3000"
    volumes:
      - ./webapp:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - socius_network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M

  sub-frontend:
    build:
      context: ./sub-webapp
      dockerfile: Dockerfile.dev
    container_name: ${PROJECT_NAME:-socius}_sub_frontend
    depends_on:
      - backend
    environment:
      API_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: /api
      NODE_ENV: ${NODE_ENV:-development}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=1024"
    ports:
      - "3060:3000"
    volumes:
      - ./sub-webapp:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - socius_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M

  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME:-socius}_nginx
    volumes:
      - ${NGINX_CONF_PATH:-./docker/nginx.conf}:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    depends_on:
      - frontend
      - sub-frontend
      - backend
      - minio
    networks:
      - socius_network

networks:
  socius_network:
    driver: bridge

volumes:
  pgadmin-data:
