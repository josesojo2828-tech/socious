services:
  database:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME:-nutrigest}_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nutrigest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrigest_password}
      POSTGRES_DB: ${POSTGRES_DB:-nutrigest_cloud}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrigest_user} -d ${POSTGRES_DB:-nutrigest_cloud}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT_BIND:-5432}:5432"
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    networks:
      - nutringest_network

