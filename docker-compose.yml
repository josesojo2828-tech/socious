  backend:
    build:
      context: ./serverapp
      dockerfile: Dockerfile.dev
    container_name: ${PROJECT_NAME:-nutrigest}_backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nutrigest_user}:${POSTGRES_PASSWORD:-nutrigest_password}@database:5432/${POSTGRES_DB:-nutrigest_cloud}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-nutrigest_user}:${POSTGRES_PASSWORD:-nutrigest_password}@database:5432/${POSTGRES_DB:-nutrigest_cloud}?schema=public
      REDIS_HOST: cache
      REDIS_PORT: 6379
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-customtokensecret}
      PORT: 3001
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-nutrigest_minio}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-nutrigest_secret_minio}}
      MINIO_BUCKET: ${MINIO_BUCKET:-nutrigest-uploads}
      APP_URL: ${APP_URL:-http://localhost:3001}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NODE_OPTIONS: "--max-old-space-size=1024"
      AT_SECRET: ${AT_SECRET:-}
      RT_SECRET: ${RT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "${BACKEND_PORT:-11003}:3001"
    volumes:
      - ./serverapp:/app
      - /app/node_modules
      - /app/dist
      - ./docker/data/uploads:/app/public/files
    networks:
      - nutringest_network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

