events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 1. DNS de Docker (con TTL corto de 5s para adaptarse a reinicios de contenedores)
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        # 2. API - Backend (resolución dinámica con variable para evitar 502 por IP desactualizada)
        location /api/ {
            set $backend_url http://backend:3001;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. PGAdmin (Resolución dinámica)
        location /pgadmin/ {
            # Al usar una variable, forzamos a NGINX a usar el resolver
            # en lugar de fallar en el arranque.
            set $pgadmin_url http://pgadmin:80;

            # Simulamos el comportamiento del trailing slash de tu proxy_pass original
            rewrite ^/pgadmin/(.*) /$1 break;

            proxy_pass $pgadmin_url;
            proxy_set_header Host $host;
            proxy_set_header X-Script-Name /pgadmin;
        }

        # 4. MinIO Public Uploads
        location /nutrigest-uploads/ {
            set $minio_url http://minio:9000;
            proxy_pass $minio_url/nutrigest-uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Backend Static Assets
        location /public/ {
            set $backend_url http://backend:3001;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 6. Frontend
        location / {
            set $frontend_url http://frontend:3000;
            proxy_pass $frontend_url;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}